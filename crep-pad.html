<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Notepad</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Source+Code+Pro:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#525954; --ink:#f2f4f2; --muted:#d0d6d2; --line:#2a2f2c; --strong:#151816; --btn:#396b46; --btn2:#43794f; --on:#fff;
  --disp:'Oswald','Arial Narrow','Helvetica Neue',sans-serif; --mono:'Source Code Pro',ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#eef1ee;--ink:#1b1f1c;--muted:#56605a;--line:#a9b1ab;--strong:#1b1f1c;--btn:#396b46;--btn2:#43794f;--on:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1ee;--ink:#1b1f1c;--muted:#56605a;--line:#a9b1ab;--strong:#1b1f1c;--btn:#396b46;--btn2:#43794f;--on:#fff}}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);font-weight:400;font-size:15px;transition:background .4s,color .4s;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--strong);outline-offset:3px}
.wrap{max-width:660px;margin:0 auto;padding:44px 20px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
h1{font-size:1.15rem;font-weight:400;letter-spacing:.01em}
.theme{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:border-color .3s,transform .4s}
.theme:hover{border-color:var(--strong);transform:rotate(20deg)}
.theme svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme .moon{display:none}
:root[data-theme="light"] .theme .sun{display:none}:root[data-theme="light"] .theme .moon{display:block}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .theme .sun{display:none}:root:not([data-theme="dark"]) .theme .moon{display:block}}

.box{border:1px solid var(--line);border-radius:12px;padding:6px 16px 14px;transition:border-color .3s}
.box:focus-within{border-color:var(--strong)}
input,textarea{width:100%;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;resize:none}
.f{padding:11px 0;border-bottom:1px solid var(--line)}
.f.n{font-size:1.05rem;font-weight:400}
textarea.f{height:84px;border:0;line-height:1.5}
::placeholder{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px}
.seg{display:flex;gap:6px}
.pill{padding:6px 13px;border:1px solid var(--line);border-radius:999px;font-size:.82rem;color:var(--muted);transition:all .25s}
.pill:hover{border-color:var(--strong);color:var(--ink)}
.pill[aria-pressed="true"]{border-color:var(--btn);color:var(--on);background:var(--btn)}
.add{padding:8px 22px;border:1px solid var(--btn);background:var(--btn);border-radius:999px;color:var(--on);font-size:.9rem;font-weight:400;transition:all .25s}
.add:hover{background:var(--btn2);border-color:var(--btn2)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-size:.82rem;color:var(--muted)}
.hair{height:2px;background:var(--line);margin-bottom:6px;position:relative}
.hair b{position:absolute;left:0;top:0;height:2px;background:var(--btn2);width:0;transition:width .6s cubic-bezier(.2,.9,.3,1)}

.item{padding:16px 0;border-bottom:1px solid var(--line);animation:in .35s ease;transition:opacity .3s,transform .3s}
.item.leave{opacity:0;transform:translateX(14px)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;gap:14px;align-items:flex-start}
.chk{flex:none;width:20px;height:20px;border:1px solid var(--strong);border-radius:50%;margin-top:2px;display:grid;place-items:center;transition:background .25s}
.done .chk{background:var(--btn);border-color:var(--btn)}
.chk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on);transform:scale(0);transition:transform .25s}
.done .chk::after{transform:scale(1)}
.hd{flex:1;min-width:0}
.nm{font-weight:400;font-size:1.02rem;word-break:break-word;transition:color .3s}
.rl{color:var(--muted);font-size:.85rem;margin-top:2px;word-break:break-word}
.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--strong)}
.tag{flex:none;padding:3px 11px;border:1px solid var(--line);border-radius:999px;font-size:.75rem;color:var(--muted);transition:all .25s}
.tag:hover{border-color:var(--strong)}
[data-p="high"] .tag{background:var(--btn);border-color:var(--btn);color:var(--on)}
[data-p="med"] .tag{border-color:var(--strong);color:var(--ink)}
.note{margin:8px 0 0 34px;width:calc(100% - 34px);font-size:.88rem;line-height:1.55;color:var(--muted);overflow:hidden;min-height:22px;transition:color .3s}
.note:focus{color:var(--ink)}
.del{margin:2px 0 0 34px;font-size:.75rem;color:var(--muted);opacity:0;transition:all .25s}
.item:hover .del,.del:focus-visible{opacity:1}.del:hover{color:var(--ink)}
.empty{padding:50px 0;text-align:center;color:var(--muted);font-size:.9rem}

@media (hover:hover) and (pointer:fine){body.fx,body.fx *{cursor:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}#ring,#dot,#fxc{display:none}body.fx,body.fx *{cursor:auto!important}}
h1,.nm,.pill,.add,.tag,.cnt,.del,.f.n{font-family:var(--disp);text-transform:uppercase;letter-spacing:.03em}
h1{font-size:1.9rem;font-weight:500;letter-spacing:.02em}
.nm{font-size:1.2rem;font-weight:500}
.f.n{font-size:1.15rem;font-weight:500}
.pill,.add,.tag,.cnt,.del{font-weight:400;font-size:.85rem}
.tag{font-size:.78rem}
.rl{text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
.note{font-size:.85rem}
#dot,#ring{position:fixed;left:0;top:0;pointer-events:none;z-index:99;border-radius:50%;opacity:0}
#dot{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--ink)}
#ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--ink);transition:width .35s cubic-bezier(.3,1.5,.5,1),height .35s cubic-bezier(.3,1.5,.5,1),margin .35s cubic-bezier(.3,1.5,.5,1),background .3s,opacity .3s}
#ring.hov{width:58px;height:58px;margin:-29px 0 0 -29px;background:color-mix(in srgb,var(--btn) 45%,transparent)}
#ring.dn{width:22px;height:22px;margin:-11px 0 0 -11px}
#fxc{position:fixed;left:0;top:0;pointer-events:none;z-index:97}
.rip{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid var(--ink);border-radius:50%;pointer-events:none;z-index:98;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(3.4);opacity:0}}
</style>
</head>
<body>
<div id="ring"></div><div id="dot"></div>
<div class="wrap">
  <header>
    <h1>Prep notepad</h1>
    <button class="theme" id="theme" aria-label="Toggle light and dark theme"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>

  <section class="box" aria-label="Add a company">
    <input class="f n" id="name" placeholder="Company" autocomplete="off" maxlength="80">
    <input class="f" id="role" placeholder="Role, package or date" autocomplete="off" maxlength="100">
    <textarea class="f" id="notes" placeholder="Notes"></textarea>
    <div class="row">
      <div class="seg" id="pri" role="group" aria-label="Priority">
        <button class="pill" data-p="high" aria-pressed="false">High</button>
        <button class="pill" data-p="med" aria-pressed="true">Medium</button>
        <button class="pill" data-p="low" aria-pressed="false">Low</button>
      </div>
      <button class="add" id="add">Add</button>
    </div>
  </section>

  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="Filter">
      <button class="pill" data-f="all" aria-pressed="true">All</button>
      <button class="pill" data-f="high" aria-pressed="false">High</button>
      <button class="pill" data-f="med" aria-pressed="false">Medium</button>
      <button class="pill" data-f="low" aria-pressed="false">Low</button>
      <button class="pill" data-f="open" aria-pressed="false">To prepare</button>
    </div>
    <span class="cnt" id="cnt">0 of 0 prepared</span>
  </div>
  <div class="hair"><b id="fill"></b></div>

  <div id="list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var KEY='prep-notepad-v1', THEME='prep-notepad-theme-min';
  var items=[], filter='all', pri='med';
  var ORDER={high:0,med:1,low:2}, LABEL={high:'High',med:'Medium',low:'Low'}, NEXT={high:'med',med:'low',low:'high'};
  var $=function(s){return document.querySelector(s)}, list=$('#list');

  try{var r=localStorage.getItem(KEY);if(r)items=JSON.parse(r)||[]}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function grow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}

  var root=document.documentElement;
  try{var t=localStorage.getItem(THEME);if(t)root.setAttribute('data-theme',t)}catch(e){}
  $('#theme').onclick=function(){
    var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
    var n=cur==='dark'?'light':'dark';root.setAttribute('data-theme',n);
    try{localStorage.setItem(THEME,n)}catch(e){}
  };

  function render(){
    var shown=items.filter(function(i){return filter==='all'||(filter==='open'?!i.done:i.p===filter)})
      .sort(function(a,b){return (a.done-b.done)||(ORDER[a.p]-ORDER[b.p])||(b.id-a.id)});
    list.innerHTML=shown.length?shown.map(function(i){
      return '<article class="item'+(i.done?' done':'')+'" data-id="'+i.id+'" data-p="'+i.p+'">'+
        '<div class="top"><button class="chk" data-a="done" aria-label="Mark prepared"></button>'+
        '<div class="hd"><div class="nm">'+esc(i.name)+'</div>'+(i.role?'<div class="rl">'+esc(i.role)+'</div>':'')+'</div>'+
        '<button class="tag" data-a="pri" title="Change priority">'+LABEL[i.p]+'</button></div>'+
        '<textarea class="note" rows="1" placeholder="Add notes" aria-label="Notes">'+esc(i.notes||'')+'</textarea>'+
        '<button class="del" data-a="del">Delete</button></article>';
    }).join(''):'<div class="empty">'+(items.length?'Nothing here.':'No companies yet. Add one above.')+'</div>';
    list.querySelectorAll('.note').forEach(grow);
    var d=items.filter(function(i){return i.done}).length;
    $('#cnt').textContent=d+' of '+items.length+' prepared';
    $('#fill').style.width=(items.length?d/items.length*100:0)+'%';
  }

  function add(){
    var n=$('#name').value.trim();
    if(!n){$('#name').focus();return}
    items.push({id:Date.now(),name:n,role:$('#role').value.trim(),notes:$('#notes').value.trim(),p:pri,done:false});
    $('#name').value=$('#role').value=$('#notes').value='';
    save();render();$('#name').focus();
  }
  $('#add').onclick=add;
  $('#name').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
  function group(id,fn){$(id).onclick=function(e){var b=e.target.closest('button');if(!b)return;
    this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});fn(b)}}
  group('#pri',function(b){pri=b.dataset.p});
  group('#chips',function(b){filter=b.dataset.f;render()});

  list.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b)return;
    var el=b.closest('.item'),id=+el.dataset.id,it=items.find(function(x){return x.id===id});
    if(b.dataset.a==='done'){it.done=!it.done;save();render()}
    else if(b.dataset.a==='pri'){it.p=NEXT[it.p];save();render()}
    else{el.classList.add('leave');setTimeout(function(){items=items.filter(function(x){return x.id!==id});save();render()},280)}
  });
  list.addEventListener('input',function(e){
    if(!e.target.classList.contains('note'))return;
    grow(e.target);
    var id=+e.target.closest('.item').dataset.id,it=items.find(function(x){return x.id===id});
    if(it){it.notes=e.target.value;save()}
  });

  if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    document.body.classList.add('fx');
    var dot=$('#dot'),ring=$('#ring'),x=innerWidth/2,y=innerHeight/2,rx=x,ry=y,hx=x,hy=y,fr=0;
    var N=30,pts=[],W=innerWidth,H=innerHeight,ren,sc,cam,mat,geo,pos,alp,i;
    function colors(){
      var cs=getComputedStyle(document.documentElement);
      mat.uniforms.cA.value.set(cs.getPropertyValue('--ink').trim());
      mat.uniforms.cB.value.set(cs.getPropertyValue('--btn2').trim());
    }
    if(window.THREE){
      try{ren=new THREE.WebGLRenderer({alpha:true,antialias:true})}catch(e){ren=null}
      if(ren){
        ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setSize(W,H);
        ren.domElement.id='fxc';document.body.appendChild(ren.domElement);
        sc=new THREE.Scene();cam=new THREE.OrthographicCamera(0,W,0,H,-1,1);
        pos=new Float32Array(N*6);alp=new Float32Array(N*2);
        var idx=[];for(i=0;i<N-1;i++){var a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
        geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
        geo.setAttribute('alpha',new THREE.BufferAttribute(alp,1));
        geo.setIndex(idx);
        mat=new THREE.ShaderMaterial({transparent:true,depthTest:false,side:THREE.DoubleSide,
          uniforms:{cA:{value:new THREE.Color()},cB:{value:new THREE.Color()}},
          vertexShader:'attribute float alpha;varying float vA;void main(){vA=alpha;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
          fragmentShader:'uniform vec3 cA;uniform vec3 cB;varying float vA;void main(){gl_FragColor=vec4(mix(cB,cA,vA),vA);}'});
        var mesh=new THREE.Mesh(geo,mat);mesh.frustumCulled=false;sc.add(mesh);
        for(i=0;i<N;i++)pts.push({x:x,y:y});
        colors();
        addEventListener('resize',function(){W=innerWidth;H=innerHeight;ren.setSize(W,H);cam.right=W;cam.bottom=H;cam.updateProjectionMatrix()});
      }
    }
    addEventListener('mousemove',function(e){x=e.clientX;y=e.clientY;dot.style.opacity=ring.style.opacity=1;dot.style.transform='translate('+x+'px,'+y+'px)'});
    document.addEventListener('mouseleave',function(){dot.style.opacity=ring.style.opacity=0});
    document.addEventListener('mouseover',function(e){ring.classList.toggle('hov',!!e.target.closest('button,input,textarea'))});
    addEventListener('mousedown',function(e){
      ring.classList.add('dn');
      var r=document.createElement('div');r.className='rip';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
      document.body.appendChild(r);setTimeout(function(){r.remove()},650);
    });
    addEventListener('mouseup',function(){ring.classList.remove('dn')});
    (function loop(){
      rx+=(x-rx)*.2;ry+=(y-ry)*.2;
      ring.style.transform='translate('+rx+'px,'+ry+'px)';
      if(ren){
        if(++fr%20===0)colors();
        hx+=(x-hx)*.5;hy+=(y-hy)*.5;pts[0].x=hx;pts[0].y=hy;
        for(i=1;i<N;i++){pts[i].x+=(pts[i-1].x-pts[i].x)*.38;pts[i].y+=(pts[i-1].y-pts[i].y)*.38}
        var maxW=ring.classList.contains('hov')?12:9;
        for(i=0;i<N;i++){
          var p=pts[i],a=pts[Math.max(i-1,0)],b=pts[Math.min(i+1,N-1)];
          var dx=b.x-a.x,dy=b.y-a.y,l=Math.sqrt(dx*dx+dy*dy)||1,t=i/(N-1),w=maxW*Math.pow(1-t,1.1);
          var nx=-dy/l*w,ny=dx/l*w;
          pos[i*6]=p.x+nx;pos[i*6+1]=p.y+ny;pos[i*6+3]=p.x-nx;pos[i*6+4]=p.y-ny;
          alp[i*2]=alp[i*2+1]=Math.pow(1-t,1.4)*.9;
        }
        geo.attributes.position.needsUpdate=true;geo.attributes.alpha.needsUpdate=true;
        ren.render(sc,cam);
      }
      requestAnimationFrame(loop);
    })();
  }
  render();
})();
</script>
</body>
</html>
